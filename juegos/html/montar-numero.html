<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔔 Monta el número</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container">
    <a class="back" href="../index.html">← Menú</a>
    <h1>🔔 Monta el número</h1>
    <p class="help">Arma el número con las cartas del mismo color y toca la campana.</p>
    <p class="info">Ronda <span id="round">1</span>/5 · Tiempo: <span id="time">0</span>s</p>
    <div class="numcard" id="target"></div>
    <div class="slots" id="slots"></div>
    <div class="hand" id="hand"></div>
    <button class="bell" id="bell">🔔</button>
    <p class="msg" id="msg"></p>
    <button class="alt" id="reset">Reiniciar</button>
  </main>
  <script src="../js/montar-numero.js"></script>
</body>
</html>
